# Relais Cloudflare de l'espace pro (statuts des biens + mot de passe chiffré).
# Déployé automatiquement par Cloudflare Workers Builds à chaque push sur GitHub.
name = "immobilier-angevin"
main = "serverless/statut-proxy.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[kv_namespaces]]
binding = "STATUTS"
id = "240745a1136548bb917eaf33dd4309e7"

# Alertes e-mail : tous les jours à 7 h UTC (8 h ou 9 h à Paris)
[triggers]
crons = ["0 7 * * *"]

# Réglages publics (le secret RESEND_API_KEY s'ajoute dans Cloudflare, jamais ici).
# À la bascule du domaine : SITE_URL → https://votre-domaine.fr/
# et EMAIL_FROM → "L'Ardoise Immobilier <alertes@votre-domaine.fr>" (domaine vérifié chez Resend).
[vars]
SITE_URL = "https://galfomorel-droid.github.io/immobilier-angevin/"
RELAIS_URL = "https://immobilier-angevin.galfomorel.workers.dev/"
FLUX_3G = "https://raw.githubusercontent.com/galfomorel-droid/charles-morel-immobilier/main/data/biens.json"
EMAIL_FROM = "L'Ardoise Immobilier <onboarding@resend.dev>"
EMAIL_AGENT = "charles.morel@3gimmobilier.com"
TELEPHONE = "06 38 55 53 55"
